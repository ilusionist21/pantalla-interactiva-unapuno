name: Sincronizar Facebook UNA Puno

on:
  schedule:
    # GitHub puede omitir eventos programados. Reintentar cada 5 minutos
    # y hacer scraping solo si la última sincronización tiene 15+ minutos.
    - cron: '3/5 * * * *'
  workflow_dispatch: # Permite ejecutar la sincronización manual con 1 clic desde GitHub
permissions:
  contents: write

concurrency:
  group: facebook-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Comprobar si toca sincronizar
        id: due
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timedelta, timezone

          due = True
          if os.environ['GITHUB_EVENT_NAME'] == 'schedule':
              try:
                  with open('data/posts.json', encoding='utf-8') as file:
                      last_sync = json.load(file)['university']['last_sync']
                  synced_at = datetime.fromisoformat(last_sync.replace('Z', '+00:00'))
                  due = datetime.now(timezone.utc) - synced_at >= timedelta(minutes=15)
              except (OSError, ValueError, KeyError, TypeError):
                  pass

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              print(f"run={'true' if due else 'false'}", file=output)
          print('Sincronización pendiente' if due else 'Datos aún recientes')
          PY

      - name: Instalar dependencias necesarias
        if: steps.due.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Ejecutar sincronizador de Facebook UNA Puno
        if: steps.due.outputs.run == 'true'
        run: |
          python scripts/sync_facebook.py

      - name: Guardar cambios en posts.json si hay novedades (sin guardar fotos pesadas)
        if: steps.due.outputs.run == 'true'
        shell: bash
        run: |
          set -e
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add data/posts.json data/posts.js
          if git diff --cached --quiet; then
            echo "No hay cambios en data/posts.json."
            exit 0
          fi

          git commit -m "Auto-sync: 5 últimas publicaciones de Facebook @unapunooficial [skip ci]"

          # Puede haber una ejecución automática que haya publicado justo
          # antes. Reintentar la rebase evita dejar el scraper en rojo por
          # una carrera de push, sin sobrescribir contenido remoto.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rechazado; sincronizando con origin/main (intento ${attempt}/3)..."
            git pull --rebase -X theirs origin main
            sleep 5
          done

          echo "No se pudo publicar data/posts.json después de 3 intentos."
          exit 1
