name: Sincronizar Facebook UNA Puno Cada 15 Minutos

on:
  schedule:
    # Se ejecuta automáticamente cada 15 minutos en los servidores de GitHub (100% gratis)
    - cron: '*/15 * * * *'
  workflow_dispatch: # Permite ejecutar la sincronización manual con 1 clic desde GitHub
  push:
    branches:
      - main
      - master
    paths:
      - 'scripts/**'

permissions:
  contents: write

concurrency:
  group: facebook-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias necesarias
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Ejecutar sincronizador de Facebook UNA Puno
        run: |
          python scripts/sync_facebook.py

      - name: Guardar cambios en posts.json si hay novedades (sin guardar fotos pesadas)
        shell: bash
        run: |
          set -e
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git pull --rebase -X theirs origin main
          git add data/posts.json data/posts.js
          if git diff --cached --quiet; then
            echo "No hay cambios en data/posts.json."
            exit 0
          fi

          git commit -m "Auto-sync: 5 últimas publicaciones de Facebook @unapunooficial [skip ci]"

          # Puede haber una ejecución automática que haya publicado justo
          # antes. Reintentar la rebase evita dejar el scraper en rojo por
          # una carrera de push, sin sobrescribir contenido remoto.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rechazado; sincronizando con origin/main (intento ${attempt}/3)..."
            git pull --rebase -X theirs origin main
            sleep 5
          done

          echo "No se pudo publicar data/posts.json después de 3 intentos."
          exit 1
